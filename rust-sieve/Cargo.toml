[package]
name = "ternary-goldbach-sieve"
version = "0.1.0"
edition = "2021"
description = "Segmented sieve that emits finite certificates for TernaryGoldbach-Lean4"

# No external dependencies on purpose: the certificate format must stay trivial so the
# Lean checker in TernaryGoldbach/SieveCert/CertChecker.lean can re-verify it.

[[bin]]
name = "ternary-goldbach-sieve"
path = "src/main.rs"
